# Drop-in for polyai-autoloop.service on poly4090: run the loop from its own checkout (/kvm/loop/ai) so updates to
# the loop never touch the shared checkout that polyai.serve uses. The extension comes from config.json's ext_dir.
# Install: cp poly4090-loop.conf /etc/systemd/system/polyai-autoloop.service.d/ && systemctl daemon-reload
[Service]
WorkingDirectory=/kvm/loop/ai
ExecStart=
ExecStart=/kvm/polytopia/.venv/bin/python /kvm/loop/ai/tools/autoloop.py run
