[package]
name = "polyai-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "polyai_engine"
crate-type = ["cdylib"]

[dependencies]
polyai-core = { path = "../polyai-core" }
# mimalloc as the extension's allocator: the collector's worker threads allocate and free small buffers all the time.
polytopia-sim = { workspace = true, features = ["mimalloc"] }
pyo3 = { version = "0.25", features = ["extension-module"] }
numpy = "0.25"
rayon = "1"
